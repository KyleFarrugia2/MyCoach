name: MyCoach
options:
  bundleIdPrefix: com.company
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MyCoach:
    type: application
    platform: iOS
    sources:
      - path: MyCoach
        excludes:
          - "Resources/Legal/**"
          - "Resources/InfoPlist.snippets.md"
    resources:
      - path: MyCoach/Resources/Assets.xcassets
      - path: MyCoach/Resources/PrivacyInfo.xcprivacy
      - path: MyCoach/Resources/StoreKit/MyCoach.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.company.mycoach
        PRODUCT_NAME: MyCoach
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "My Coach"
        INFOPLIST_KEY_CFBundleName: MyCoach
        INFOPLIST_KEY_NSCameraUsageDescription: "My Coach uses the camera to scan food barcodes and to take your weekly progress photos."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Step data is used optionally to compare against your step target. Manual entry always works."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    dependencies:
      - sdk: HealthKit.framework
      - sdk: StoreKit.framework
    scheme:
      testTargets:
        - MyCoachTests
        - MyCoachUITests
      storeKitConfiguration: MyCoach/Resources/StoreKit/MyCoach.storekit
  MyCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyCoachTests
    dependencies:
      - target: MyCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.company.mycoach.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MyCoach"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MyCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MyCoachUITests
    dependencies:
      - target: MyCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.company.mycoach.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyCoach
